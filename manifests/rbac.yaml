apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api
  namespace: platform-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-api-namespace-manager
rules:

  - apiGroups: [""]
    resources:
      - namespaces
    verbs:
      - get
      - list
      - create

  - apiGroups: [""]
    resources:
      - resourcequotas
    verbs:
      - get
      - list
      - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-api-namespace-manager
subjects:
  - kind: ServiceAccount
    name: platform-api
    namespace: platform-system
roleRef:
  kind: ClusterRole
  name: platform-api-namespace-manager
  apiGroup: rbac.authorization.k8s.io
